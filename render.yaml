services:
  - name: samhita-health
    type: web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    envVars:
      - key: NODE_VERSION
        value: 22.22.3

    routes:
      # The cube navigates by hash (/#why, /#how, ...), which never reaches the
      # server, so this is only a safety net for any future path-based route.
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      # Vite fingerprints filenames under /assets, so they can be cached hard.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
