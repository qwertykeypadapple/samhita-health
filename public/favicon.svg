<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Mark only, on a transparent ground: no dark tile, and no dark anywhere.
       The centre is knocked out with a mask rather than painted in a background
       colour, so it stays a real hole on a light or a dark browser tab. -->
  <mask id="core">
    <rect width="32" height="32" fill="#fff"/>
    <circle cx="16" cy="16" r="0.95" fill="#000"/>
  </mask>
  <g mask="url(#core)" transform="translate(16 16) scale(0.97) translate(-16 -16)">
    <circle cx="16" cy="16" r="9.1" fill="none" stroke="#0d8b88" stroke-width="0.6" opacity="0.22"/>
    <path fill="#0d8b88" d="M16.00 0.90Q17.80 14.20 31.10 16.00Q17.80 17.80 16.00 31.10Q14.20 17.80 0.90 16.00Q14.20 14.20 16.00 0.90Z"/>
    <circle cx="22.43" cy="9.57" r="1.45" fill="#0d8b88" opacity="0.9"/>
    <circle cx="22.43" cy="22.43" r="1.45" fill="#0d8b88" opacity="0.9"/>
    <circle cx="9.57" cy="22.43" r="1.45" fill="#0d8b88" opacity="0.9"/>
    <circle cx="9.57" cy="9.57" r="1.45" fill="#0d8b88" opacity="0.9"/>
    <circle cx="16" cy="16" r="2.3" fill="#0d8b88"/>
  </g>
</svg>
